# The whole newsroom in one box: `docker compose up -d --build`.
# Everything restarts on crash and on VM reboot (enable the docker service on the VM).
#
# Parallelism:
#   tipster   one process runs every beat concurrently; a 2nd replica is a hot standby per beat
#   editor    singleton by advisory lock; the 2nd replica takes over within ~15s if the first dies
#   reporter  replicas x REPORTER_CONCURRENCY stories planned or written at once
#   scout     replicas x SCOUT_CONCURRENCY sub-claims researched at once (the widest fan-out)
#   reviewer  replicas x REVIEWER_CONCURRENCY stories at once, reviewers in parallel

x-worker: &worker
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://newsroom:newsroom@db:5432/newsroom
  volumes:
    - newsroom-data:/data
  depends_on:
    initdb:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: newsroom
      POSTGRES_PASSWORD: newsroom
      POSTGRES_DB: newsroom
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # local only: the dashboard / psql on the box
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsroom"]
      interval: 5s
      retries: 20

  initdb:
    build: .
    command: initdb
    environment:
      DATABASE_URL: postgresql://newsroom:newsroom@db:5432/newsroom
    depends_on:
      db:
        condition: service_healthy

  tipster:
    <<: *worker
    command: tipster
    deploy:
      replicas: 2

  editor:
    <<: *worker
    command: editor
    deploy:
      replicas: 2

  reporter:
    <<: *worker
    command: reporter
    environment:
      DATABASE_URL: postgresql://newsroom:newsroom@db:5432/newsroom
      REPORTER_CONCURRENCY: "2"
    deploy:
      replicas: 1

  scout:
    <<: *worker
    command: scout
    environment:
      DATABASE_URL: postgresql://newsroom:newsroom@db:5432/newsroom
      SCOUT_CONCURRENCY: "4"
    deploy:
      replicas: 2

  reviewer:
    <<: *worker
    command: reviewer
    environment:
      DATABASE_URL: postgresql://newsroom:newsroom@db:5432/newsroom
      REVIEWER_CONCURRENCY: "2"
    deploy:
      replicas: 1

volumes:
  pgdata:
  newsroom-data:
